[project]
name = "pdf-toolkit"
version = "0.5.0"
description = "A unified PDF toolkit for compression, merging, splitting, and conversion."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.22.0",
    "pillow>=10.0.0",
    "tqdm>=4.65.0",
    "pdf2docx>=0.5.8",
    "python-docx>=1.1.0",
    "tkinterdnd2>=0.5.0",
    "pytesseract>=0.3.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]
