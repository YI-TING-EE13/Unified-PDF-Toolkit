name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Quality and security gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev --python 3.12

      - name: Run Ruff
        run: uv run --no-sync ruff check .

      - name: Run Bandit
        run: uv run --no-sync bandit -q -r src scripts -x tests -ll

      - name: Audit dependencies
        run: uv run --no-sync pip-audit --skip-editable

      - name: Measure test coverage
        run: |
          uv run --no-sync coverage run -m unittest discover -s tests -v
          uv run --no-sync coverage report

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev --python 3.12

      - name: Run unit tests
        run: uv run --no-sync python -m unittest discover -s tests -v

      - name: Verify install
        run: uv run --no-sync python verify_install.py

      - name: Compile Python files
        run: uv run --no-sync python -m compileall -q src tests verify_install.py scripts

      - name: Build package
        run: uv build

  package:
    name: PyInstaller smoke build
    runs-on: windows-latest
    needs: [quality, test]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev --python 3.12

      - name: Build Windows app
        shell: pwsh
        run: .\scripts\run_pyinstaller.ps1

      - name: Smoke test packaged app
        shell: pwsh
        run: .\scripts\smoke_packaged_app.ps1

      - name: Upload app artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Unified-PDF-Toolkit-Windows
          path: dist/Unified PDF Toolkit
