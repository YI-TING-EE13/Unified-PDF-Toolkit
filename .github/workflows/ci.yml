name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev --python 3.12

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Verify install
        run: uv run python verify_install.py

      - name: Compile Python files
        run: uv run python -m compileall -q src tests verify_install.py

      - name: Build package
        run: uv build

  package:
    name: PyInstaller smoke build
    runs-on: windows-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev --python 3.12

      - name: Build Windows app
        shell: pwsh
        run: .\scripts\run_pyinstaller.ps1

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unified-PDF-Toolkit-Windows
          path: dist/Unified PDF Toolkit
