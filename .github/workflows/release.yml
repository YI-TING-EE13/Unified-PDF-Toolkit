name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows artifacts
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev --python 3.12

      - name: Verify release metadata
        shell: pwsh
        run: |
          $arguments = @()
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $arguments += @("--tag", $env:GITHUB_REF_NAME)
          }
          uv run --no-sync python scripts/verify_beta_release.py @arguments

      - name: Run quality and security gates
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync bandit -q -r src scripts -x tests -ll
          uv run --no-sync pip-audit --skip-editable
          uv run --no-sync coverage run -m unittest discover -s tests -v
          uv run --no-sync coverage report

      - name: Verify install
        run: uv run --no-sync python verify_install.py

      - name: Build Python package
        run: uv build

      - name: Prepare Windows packaging paths
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP "pdf-toolkit-release-dist"
          $work = Join-Path $env:RUNNER_TEMP "pdf-toolkit-release-build"
          New-Item -ItemType Directory -Force -Path $dist, $work | Out-Null
          "PYINSTALLER_DIST_PATH=$dist" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PYINSTALLER_WORK_PATH=$work" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APP_BUNDLE_PATH=$dist\Unified PDF Toolkit" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check PyInstaller
        run: .\.venv\Scripts\pyinstaller.exe --version

      - name: Build Windows app bundle
        shell: pwsh
        run: .\scripts\run_pyinstaller.ps1 -DistPath "$env:PYINSTALLER_DIST_PATH" -WorkPath "$env:PYINSTALLER_WORK_PATH"

      - name: Smoke test packaged app
        shell: pwsh
        run: .\scripts\smoke_packaged_app.ps1 -AppPath "$env:APP_BUNDLE_PATH\Unified PDF Toolkit.exe"

      - name: Package Windows app bundle
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:APP_BUNDLE_PATH" -DestinationPath "dist/Unified-PDF-Toolkit-Windows.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: .\scripts\build_installer.ps1 -AppBundlePath "$env:APP_BUNDLE_PATH"

      - name: Verify release artifact versions
        shell: pwsh
        run: |
          $arguments = @(
            "--dist-dir", "dist",
            "--bundle", $env:APP_BUNDLE_PATH,
            "--windows-zip", "dist/Unified-PDF-Toolkit-Windows.zip"
          )
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $arguments += @("--tag", $env:GITHUB_REF_NAME)
          }
          uv run --no-sync python scripts/verify_beta_release.py @arguments

      - name: Write SHA-256 manifest
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem -Path "dist/*.whl", "dist/*.tar.gz", "dist/Unified-PDF-Toolkit-Windows.zip", "dist/installer/*.exe" -File
          ) | Sort-Object Name
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -LiteralPath "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Unified-PDF-Toolkit-release
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/Unified-PDF-Toolkit-Windows.zip
            dist/installer/*.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.2
        with:
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/Unified-PDF-Toolkit-Windows.zip
            dist/installer/*.exe
            dist/SHA256SUMS.txt
