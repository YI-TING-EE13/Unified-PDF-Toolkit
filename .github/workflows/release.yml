name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows artifacts
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev --python 3.12

      - name: Run tests
        run: uv run python -m unittest discover -s tests -v

      - name: Verify install
        run: uv run python verify_install.py

      - name: Build Python package
        run: uv build

      - name: Prepare Windows packaging paths
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP "pdf-toolkit-release-dist"
          $work = Join-Path $env:RUNNER_TEMP "pdf-toolkit-release-build"
          New-Item -ItemType Directory -Force -Path $dist, $work | Out-Null
          "PYINSTALLER_DIST_PATH=$dist" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PYINSTALLER_WORK_PATH=$work" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APP_BUNDLE_PATH=$dist\Unified PDF Toolkit" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check PyInstaller
        run: .\.venv\Scripts\pyinstaller.exe --version

      - name: Build Windows app bundle
        shell: pwsh
        run: .\.venv\Scripts\pyinstaller.exe pdf-toolkit.spec --noconfirm --distpath "$env:PYINSTALLER_DIST_PATH" --workpath "$env:PYINSTALLER_WORK_PATH"

      - name: Package Windows app bundle
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:APP_BUNDLE_PATH" -DestinationPath "dist/Unified-PDF-Toolkit-Windows.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: .\scripts\build_installer.ps1 -AppBundlePath "$env:APP_BUNDLE_PATH"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Unified-PDF-Toolkit-release
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/Unified-PDF-Toolkit-Windows.zip
            dist/installer/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/Unified-PDF-Toolkit-Windows.zip
            dist/installer/*.exe
